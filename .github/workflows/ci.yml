name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@a81bbbf8298c0fa03ea29cdc473d45769f953675 # v2.6.0

      - name: Set up Node.js
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.6.2
        with:
          node-version: 14

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check types
        run: yarn typecheck

      - name: Run tests
        run: yarn test

      - name: Build
        run: yarn build